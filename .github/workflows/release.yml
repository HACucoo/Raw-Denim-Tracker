name: Release APK

on:
  push:
    tags:
      - 'v*'
  # By hand: build only (no release), e.g. to try a newer Flutter before raising the pin below
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter version to build with (any = latest stable)
        required: false
        default: any

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned for releases, so a new Flutter cannot break one; raise after a build-only run by hand
          flutter-version: ${{ github.event_name == 'workflow_dispatch' && inputs.flutter_version || '3.41.5' }}

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          printf 'storeFile=keystore.jks\nkeyPassword=%s\nkeyAlias=%s\nstorePassword=%s\n' \
            "${{ secrets.KEY_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            "${{ secrets.STORE_PASSWORD }}" \
            > android/key.properties

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        if: startsWith(github.ref, 'refs/tags/')
        run: mv build/app/outputs/flutter-apk/app-release.apk Raw-Denim-Tracker-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Raw-Denim-Tracker-${{ github.ref_name }}.apk
          generate_release_notes: false
          name: ${{ github.ref_name }}
